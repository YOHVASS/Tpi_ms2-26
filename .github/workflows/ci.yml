name: CI

on:
  push:
    branches: [main]
  pull_request:



jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Linter
        run: ruff check solicitudes tests app.py
      - name: Formato
        run: ruff format --check solicitudes tests app.py
      - name: Pruebas + cobertura de ramas (umbral 80 %)
        run: pytest --cov=solicitudes --cov-branch --cov-fail-under=80